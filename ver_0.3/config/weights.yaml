# Priority configurations (SPEC §5). Design parameters only.
#
# Each configuration favors one job size class, then orders by shortest time limit, then by
# fairness (order set 2026-11-26):
#   size      QOS factor: every job runs in the QOS of its size class (SPEC §4); a
#             configuration sets the three QOS priorities. Slurm normalizes them by the
#             largest QOS priority, so 0/50/100 become 0/0.5/1.
#   time      Job-size factor with SMALL_RELATIVE_TO_TIME and PriorityFavorSmall=NO:
#             32 / T_min / 512 for single-node jobs, so shorter limits score higher.
#   fairness  Fair-share factor.
#
# Weights (rendered by .venv/bin/python -m sim.weights render):
#   PriorityWeightQOS       = (points per size step) / (smallest step between distinct
#                             normalized QOS priorities). tiers.size 'strict' (set 2026-11-26):
#                             one step exceeds the largest possible time + fairness + age
#                             total, so the favored class always comes first.
#   PriorityWeightJobSize = tiers.time / scale, PriorityWeightFairshare = tiers.fairness / scale,
#                             where scale is the factor's Gini mean difference among waiting
#                             jobs (config/factor_scales.yaml), so two typical waiting jobs
#                             differ by about tiers.time and tiers.fairness points.

tiers:
  size: strict      # or a number of points per size step (soft tiers)
  time: 2000
  fairness: 1000

# Same in all configurations: tie-breaker and starvation guard.
# PriorityMaxAge=1-0 is set in sim/etc/slurm.conf.in.
age_weight: 500

# Size class (SPEC §4) -> QOS label. The QOS have identical limits; they only carry priority.
size_qos:
  sm: small
  med: medium
  lg: large

# Numbered as requested on 2026-11-26. C0 serves the "mix" queue scenario.
configs:
  C0: {name: neutral, scenario: mix, qos_priority: {small: 0, medium: 0, large: 0}}
  C1: {name: favor large, scenario: many large jobs, qos_priority: {small: 0, medium: 50, large: 100}}
  C2: {name: favor small, scenario: many small jobs, qos_priority: {small: 100, medium: 50, large: 0}}
  C3: {name: favor medium, scenario: many medium jobs, qos_priority: {small: 0, medium: 100, large: 0}}

# Fixed reference settings for Step 6 (SPEC §8.2), used as published: no tiers, no scaling.
# `static` replaces the template's static priority keys in sim/etc/slurm.conf.in for these
# runs; an empty value removes the key. They never switch, so the policy hook never loads them.
references:
  B1:
    name: typical site setting (SchedMD multifactor configuration example, fair share first)
    weights: {Age: 1000, QOS: 0, Fairshare: 10000, JobSize: 1000, TRES_CPU: 0, TRES_Mem: 0}
    static:
      PriorityDecayHalfLife: "14-0"
      PriorityMaxAge: "14-0"
      PriorityFavorSmall: "NO"
      PriorityFlags: ""                # no SMALL_RELATIVE_TO_TIME: larger requests score higher
      PriorityWeightPartition: 1000    # one partition: the same for every job
