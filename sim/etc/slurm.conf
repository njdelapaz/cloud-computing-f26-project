# Slurm configuration for the simulated 24-GPU cluster (3 nodes x 8 GPUs).
# Adapted from the UB Slurm Simulator v3.0 micro_cluster tutorial.
# Paths assume the repository is mounted at /home/slurm/project in the
# nsimakov/slurm_sim:v3.0 container (see scripts/run_sim.sh).

ClusterName=gpu24

# --- Simulator requirements ---------------------------------------------------
AuthType=auth/none
SlurmUser=slurm
SlurmdUser=root
ControlMachine=localhost
ControlAddr=localhost
AccountingStorageHost=localhost
SlurmdParameters=config_overrides
# The simulator runs in front-end mode
FrontEndName=localhost

# --- File locations -----------------------------------------------------------
JobCredentialPrivateKey=/home/slurm/project/sim/etc/slurm.key
JobCredentialPublicCertificate=/home/slurm/project/sim/etc/slurm.cert
SlurmSchedLogFile=/home/slurm/project/sim/log/sched.log
SlurmctldLogFile=/home/slurm/project/sim/log/slurmctld.log
SlurmdLogFile=/home/slurm/project/sim/log/slurmd.log
SlurmdSpoolDir=/home/slurm/project/sim/var/spool
StateSaveLocation=/home/slurm/project/sim/var/state
JobCompType=jobcomp/filetxt
JobCompLoc=/home/slurm/project/sim/log/jobcomp.log

# --- General ------------------------------------------------------------------
ReturnToService=1
MessageTimeout=60
JobRequeue=0
ProctrackType=proctrack/pgid
SwitchType=switch/none
TaskPlugin=task/none
FirstJobId=1001
UsePAM=0
GresTypes=gpu
SlurmctldTimeout=300
SlurmdTimeout=300
InactiveLimit=0
MinJobAge=300
KillWait=30
Waittime=0
PropagateResourceLimits=NONE
VSizeFactor=0
KillOnBadExit=1

# --- Scheduling (baseline: FIFO + backfill) -----------------------------------
SchedulerType=sched/backfill
SchedulerParameters=bf_max_job_user=200,bf_window=1440,bf_interval=30,bf_max_time=30,sched_interval=60,bf_max_job_test=1200,default_queue_depth=1200,bf_continue
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# priority/multifactor stays loaded under every policy, so policies can switch
# between factors (age, job size, fair-share) by changing weights only.
# The weights themselves are set by the active policy (see below).
PriorityType=priority/multifactor
PriorityDecayHalfLife=0-4
PriorityMaxAge=0-5
FairShareDampeningFactor=5

# --- Accounting (needed for fair-share) ---------------------------------------
JobAcctGatherType=jobacct_gather/linux
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageEnforce=associations,limits,qos
AccountingStoreFlags=job_comment

# --- Logging ------------------------------------------------------------------
SlurmctldDebug=info
SlurmdDebug=info
DebugFlags=Backfill
SlurmSchedLogLevel=1

# --- Active scheduling policy -------------------------------------------------
# Everything a policy may change lives in sim/etc/policies/<name>.conf:
# priority weights, the node lines (for node Weight) and the partition line
# (for LLN). scripts/run_sim.sh copies the starting policy here before a run,
# and a "switch_policy" event in the events file replaces it mid-run and
# reconfigures slurmctld (see sim/patches/switch_policy.patch).
# Hardware (3 nodes x 8 GPUs, 64 cores, 512 GB) must be identical in every
# policy file; only Weight and LLN may differ.
Include /home/slurm/project/sim/etc/policy_active.conf
