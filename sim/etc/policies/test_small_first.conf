# Policy: test_small_first
# Phase 1 test only: job-size factor favoring small jobs dominates priority.
# Included by slurm.conf through policy_active.conf. Keep the hardware on the
# NodeName and PartitionName lines identical across policies.

# Small jobs first: the job-size factor (favoring small jobs) outweighs age.
PriorityFavorSmall=YES
PriorityWeightAge=1
PriorityWeightFairshare=0
PriorityWeightJobSize=100000
PriorityWeightPartition=0
PriorityWeightQOS=0

NodeName=gpu1 Procs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=512000 Gres=gpu:8 Weight=1
NodeName=gpu2 Procs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=512000 Gres=gpu:8 Weight=1
NodeName=gpu3 Procs=64 Sockets=2 CoresPerSocket=32 ThreadsPerCore=1 RealMemory=512000 Gres=gpu:8 Weight=1
PartitionName=gpu Nodes=gpu[1-3] Default=YES DefMemPerCPU=8000 DefCpuPerGPU=8 MaxTime=INFINITE State=UP LLN=NO
