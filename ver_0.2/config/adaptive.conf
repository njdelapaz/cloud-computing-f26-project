# Controller settings (SPEC §13.1). One key=value per line; Signal lines carry Enter/Exit too.
PoliciesFile=/work/config/policies.conf
ScheduleFile=/work/config/schedule_none.conf
TMin=60min
DefaultPolicy=BASE

# Hysteresis thresholds: placeholders until P6 calibrates them
Signal=fairness Enter=0.40 Exit=0.30
Signal=balance  Enter=0.50 Exit=0.35
Signal=util     Enter=0.25 Exit=0.15
MinDemand=0.10
QueuePressureMin=0.5

LogFile=/work/results/decisions.csv
PlacementLog=/work/results/placements.csv

# Override windows: none by default (schedule_none.conf). ScheduleFile=/work/config/schedule.conf
# gives the W6 daily peak (12:00-17:00 UTC -> U). A window wins in every mode below (A2).

# Experiment modes (at most one; SPEC §13.1):
#   FixedPolicy=<name>                       pin one policy for the whole run (static runs)
#   ForceAlternate=F,U  ForcePeriod=15min    switch between two policies on a timer (P5)
