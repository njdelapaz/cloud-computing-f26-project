# Override windows (SPEC §13.1). Times are UTC, on the simulator clock.
# While a window covers the current time, its policy is active and the controller doesn't sample state.
# Forms:
#   Window Start=YYYY-MM-DDTHH:MM:SS End=YYYY-MM-DDTHH:MM:SS Policy=<name>   one-off
#   Window Daily=HH:MM-HH:MM Policy=<name>                                   every day
# Overlapping windows are rejected.

# The trace's daily peak (SPEC §9.3, W6)
Window Daily=12:00-17:00 Policy=U

# A one-off window outside the daily peak
Window Start=2024-04-08T06:00:00 End=2024-04-08T09:00:00 Policy=F
